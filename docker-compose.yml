services:

  # ── PostgreSQL 16 + PostGIS ──────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.3
    container_name: logicore-db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-logicore}
      POSTGRES_USER:     ${POSTGRES_USER:-logicore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logicore}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logicore} -d ${POSTGRES_DB:-logicore}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Redis (cache layer — preparado para uso futuro) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: logicore-cache
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend Spring Boot ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logicore-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      DATABASE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-logicore}
      DATABASE_USER:     ${POSTGRES_USER:-logicore}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-logicore}
      JWT_SECRET:        ${JWT_SECRET:-logicore-dev-secret-change-in-production-min-256bit-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      REDIS_HOST:        redis
      REDIS_PORT:        6379
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ── Frontend React (Nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logicore-web
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── pgAdmin ───────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logicore-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@logicore.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - dev
      - tools
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
