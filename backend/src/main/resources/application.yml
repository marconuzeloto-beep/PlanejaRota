spring:
  application:
    name: logicore-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/logicore}
    username: ${DATABASE_USER:logicore}
    password: ${DATABASE_PASSWORD:logicore}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LogiCoreHikariPool
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  async:
    executor:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 100

app:
  security:
    jwt:
      secret: ${JWT_SECRET:logicore-dev-secret-change-in-production-256bit}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  distance:
    provider: ${DISTANCE_PROVIDER:haversine}
    cache:
      enabled: ${DISTANCE_CACHE_ENABLED:true}
    osrm:
      base-url: ${OSRM_BASE_URL:http://router.project-osrm.org}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.logicore: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.logicore: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
spring:
  config:
    activate:
      on-profile: development
  datasource:
    hikari:
      maximum-pool-size: 10

logging:
  level:
    com.logicore: DEBUG
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: production

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    com.logicore: INFO
    org.hibernate.SQL: ERROR

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    com.logicore: INFO
    org.hibernate.SQL: WARN
